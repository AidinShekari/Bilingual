name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  latex:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-lang-arabic texlive-latex-extra \
            texlive-pictures texlive-science texlive-bibtex-extra \
            texlive-fonts-recommended texlive-fonts-extra \
            biber latexmk python3

      - name: Lint sources
        run: python3 scripts/lint_sources.py

      - name: Validate worked examples
        run: make validate

      - name: Build all documents
        run: make -j4 all

      - name: Check build logs
        run: make check

      - name: Upload PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: pdf/*.pdf
